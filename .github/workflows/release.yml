name: release
# CS-196: on a v* tag, goreleaser builds stopbard + stopbar (linux/darwin,
# amd64/arm64), checksums, SBOMs (syft), keyless cosign signatures (this
# workflow's GitHub OIDC identity) and the multi-arch image on ghcr.io.
# Verify: docs/releasing.md. CI dry-runs the same config on every PR.
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # push to ghcr.io
      id-token: write # keyless cosign (Fulcio certificate from the OIDC token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      # Tool pins; keep in step with ci.yml and scripts/e2e.sh.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with: {cosign-release: v3.1.5}
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with: {syft-version: v1.57.2}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
