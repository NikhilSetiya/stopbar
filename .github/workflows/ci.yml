name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # pin to SHA in CS-004
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: fuzz smoke (canonicaliser)
        run: go test -run='^$' -fuzz=FuzzTransformIdempotent -fuzztime=30s ./internal/canon/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@v6
        with: {version: v1.64.8}
