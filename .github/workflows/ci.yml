name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: fuzz smoke (canonicaliser)
        run: go test -run='^$' -fuzz=FuzzTransformIdempotent -fuzztime=30s ./internal/canon/
      - name: fuzz smoke (gateway)
        run: go test -run='^$' -fuzz=FuzzEvaluate -fuzztime=30s ./internal/gateway/
      - name: fuzz smoke (EVM decoder)
        run: go test -run='^$' -fuzz=FuzzDecode -fuzztime=30s ./internal/decode/evm/
      - name: fuzz smoke (EIP-712 typed-data decoder)
        run: go test -run='^$' -fuzz=FuzzTypedData -fuzztime=30s ./internal/decode/evm/
      - name: govulncheck
        run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Every corpus attack through a live stopbard over HTTP: expected status,
      # exact policy IDs, audit record. A step in this required job, so a PR
      # that stops blocking an attack cannot merge.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: corpus replay over HTTP
        run: |
          pip install pyyaml cryptography  # cryptography: the Python SDK signs approvals in e2e_lifecycle.py (CS-151)
          go build -o "$RUNNER_TEMP/" ./cmd/stopbard ./cmd/stopbar
          python3 scripts/e2e_corpus.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
          python3 scripts/e2e_contacts.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
          python3 scripts/e2e_breaker.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
      # Load harness smoke (CS-197): a few seconds at low rate against a real
      # gatekeeper stopbard with auth and a state dir; fails on any wrong
      # outcome or error. Correctness only, not a latency gate (bench.yml).
      - name: load harness smoke
        run: go run ./scripts/bench -stopbard "$RUNNER_TEMP/stopbard" -rate 100 -duration 5s -warmup 1s
      # Reservation and escalation lifecycle over HTTP (CS-105/151/152).
      - name: lifecycle over HTTP
        run: python3 scripts/e2e_lifecycle.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
      # `stopbar init` to a protected agent: generated config, allow, escalate,
      # 2-of-2 approve, audit verify (CS-195).
      - name: stopbar init over HTTP
        run: python3 scripts/e2e_init.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
      # Both SDKs (unit tests, shared encoding-detector fixtures) and each SDK's
      # example agent against a live stopbard. Node 20 is the oldest supported.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "20"}
      - name: SDKs (TypeScript, Python) vs live stopbard
        run: ./scripts/e2e_sdk.sh "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
      # mTLS / SPIFFE client identity (CS-103): runtime-minted certs, both SDKs
      # and the CLI over https; needs the TypeScript dist the SDK step built.
      - name: mTLS over HTTPS
        run: python3 scripts/e2e_mtls.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
      # Release dry run (CS-196): the v* tag workflow's goreleaser config builds
      # every binary, archive, SBOM and the image. Publishing and signing are
      # skipped. Pins in step with release.yml and scripts/e2e.sh.
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with: {syft-version: v1.57.2}
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: {distribution: goreleaser, version: v2.20.3, args: check}
      - name: goreleaser snapshot (no publish, no sign)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,sign  # block style: a comma would end a {flow} value
      - name: release binaries report the snapshot version
        run: |
          dist/stopbard_linux_amd64_v1/stopbard -version | grep -q SNAPSHOT
          dist/stopbar_linux_amd64_v1/stopbar version | grep -q SNAPSHOT
          (cd dist && sha256sum -c checksums.txt)
          img="$(docker images ghcr.io/nikhilsetiya/stopbar --format '{{.Repository}}:{{.Tag}}' | grep amd64 | head -1)"
          docker run --rm "$img" -version | grep -q SNAPSHOT
          test "$(docker inspect -f '{{.Config.User}}' "$img")" = nonroot:nonroot
          # Non-loopback without auth (no API keys, no mTLS) must be the CS-103 refusal, not just any failure.
          out="$(docker run --rm "$img" -listen 0.0.0.0:7777 2>&1)" && { echo "image served non-loopback without auth"; exit 1; }
          grep -q "refusing to listen on .* without authentication" <<<"$out" || { echo "unexpected failure: $out"; exit 1; }
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: {version: v2.15.0}

  # Product walking skeleton (make demo): build -> stopbard from a config file ->
  # a scripted AgentKit agent on an Anvil fork of Base (allow+broadcast, deny,
  # escalate, deny, restart with cap/nonce persistence, audit verify). Non-blocking
  # until added to branch protection: it needs Foundry + a Base fork (network), so
  # it is slower and more external than the required jobs.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: install Foundry (anvil)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.config/.foundry/bin/foundryup"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
      - name: verify anvil
        run: anvil --version
      - name: make demo
        run: make demo
  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: install SDK (editable) + pytest
        run: pip install -e 'sdk/python[dev]'
      - name: build wheel (pip-installable check)
        run: pip install build && python -m build --wheel sdk/python
      - name: test
        run: python -m pytest sdk/python/tests -q
