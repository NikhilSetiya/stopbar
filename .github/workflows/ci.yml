name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: fuzz smoke (canonicaliser)
        run: go test -run='^$' -fuzz=FuzzTransformIdempotent -fuzztime=30s ./internal/canon/
      - name: fuzz smoke (gateway)
        run: go test -run='^$' -fuzz=FuzzEvaluate -fuzztime=30s ./internal/gateway/
      - name: fuzz smoke (EVM decoder)
        run: go test -run='^$' -fuzz=FuzzDecode -fuzztime=30s ./internal/decode/evm/
      - name: govulncheck
        run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Every corpus attack through a live stopbard over HTTP: expected status,
      # exact policy IDs, audit record. A step in this required job, so a PR
      # that stops blocking an attack cannot merge.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: corpus replay over HTTP
        run: |
          pip install pyyaml
          go build -o "$RUNNER_TEMP/" ./cmd/stopbard ./cmd/stopbar
          python3 scripts/e2e_corpus.py "$RUNNER_TEMP/stopbard" "$RUNNER_TEMP/stopbar"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: {version: v2.15.0}
