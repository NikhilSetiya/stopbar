name: corpus
on:
  pull_request:
    paths: ["corpus/**", "examples/policies/**", "spec/**", "scripts/validate_corpus.py"]
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pin to SHA in CS-004
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install jsonschema pyyaml
      - name: Validate corpus entries and spec fixtures against schemas
        run: python3 scripts/validate_corpus.py
      # Replay against policies is added in CS-192 once the engine exists.
