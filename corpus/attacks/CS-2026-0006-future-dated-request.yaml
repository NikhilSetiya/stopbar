id: CS-2026-0006
title: Request issued in the future (pre-signed or clock-skewed request)
category: freshness.future
target: agent_wallet.evm
description: >
  A request issued two minutes in the future. Accepting it would let a request be prepared now and
  stay valid for longer than its TTL. The freshness window is two-sided: beyond 30 seconds of skew
  ahead of the gateway clock is rejected, not just too old.
