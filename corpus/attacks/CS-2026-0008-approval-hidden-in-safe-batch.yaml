id: CS-2026-0008
title: Unlimited approval hidden inside a Safe MultiSend batch next to a harmless payment
category: approval_abuse
target: agent_wallet.evm
description: >
  A Safe transaction batches two calls through the canonical MultiSend: a 25 USDC payment to a known
  address, and approve(attacker, 2^256-1) on the same token. A reviewer, or a policy that only reads the
  top-level call, sees the payment. The decoder recurses into the batch and lifts every inner flag to the
  top, so the unlimited approval is denied whatever the outer call looks like.
setup:
  known_destinations: ["0x1111111111111111111111111111111111111111"]
  balances: {USDC: "100000"}
  prices_usd: {ETH: "3500", USDC: "1"}
  tokens: {"0x3333333333333333333333333333333333333333": {symbol: USDC, decimals: 6}}
request:
  id: req_fixture_0008
  tenant: test
  nonce: aGlkZGVuLWFwcHJvdmFsLTAwMDg
  issued_at: "2026-11-05T12:00:00Z"   # template: the replay sets it to now
  ttl_seconds: 60
  actor: {agent_id: treasury-agent}
  action:
    kind: evm_tx
    chain_id: 8453
    from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"   # Anvil test account 0 (public test key, never funded)
    to: "0x6666666666666666666666666666666666666666"     # the Safe (fixture)
    value_wei: "0"
    # execTransaction(MultiSend 1.3.0, 0, multiSend([transfer(0x1111…, 25 USDC), approve(0x9f30…0c21, 2^256-1)]), DELEGATECALL, …)
    data: ""
    tx_type: 2
    tx_nonce: "0"
    gas_limit: "300000"
    max_fee_per_gas: "2000000000"
    max_priority_fee_per_gas: "1000000000"
  provenance: {labels: [trusted_user]}
expected:
  outcome: deny
  policy_ids: [unlimited-approval]
