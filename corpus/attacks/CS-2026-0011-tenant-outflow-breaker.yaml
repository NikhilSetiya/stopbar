      to: "0x6666666666666666666666666666666666666666"
      value_wei: "0"
      # transfer(0x4444…4444, 5,243,000e18) = 10% of balance, ~$25,009: allowed
      data: "0xa9059cbb000000000000000000000000444444444444444444444444444444444444444400000000000000000000000000000000000000000004563f9979f37676e00000"
      tx_type: 2
      tx_nonce: "0"
      gas_limit: "100000"
