id: CS-2026-0011
title: Compromised requester drains the tenant; the outflow circuit breaker halts everything
category: compromised_service
target: agent_wallet.evm
description: >
  T3: the requesting service is compromised and asks for transfers that each look fine to policy
  (known destination, 10% of balance, no taint). The tenant's outflow circuit breaker (CS-124,
  $30,000 an hour) is the backstop. The first ~$25,000 transfer is allowed; the second would take the
  tenant to ~$50,000, so it trips the breaker and is denied CIRCUIT_OPEN. From then on every request
  for the tenant is denied CIRCUIT_OPEN, even a $0.48 transfer that no cap would stop and a full-balance
  transfer that policy would only escalate, until a quorum of approvers resets it
  (`stopbar breaker reset`, M of N).
