  known_destinations: ["0x4444444444444444444444444444444444444444"]
  balances: {LOBSTAR: "52430000"}
  prices_usd: {ETH: "3500", LOBSTAR: "0.00477"}
  tokens: {"0x6666666666666666666666666666666666666666": {symbol: LOBSTAR, decimals: 18}}
  limits:
    - {scope: tenant, window: 1h, max_usd: "30000", circuit_breaker: true}
    - {scope: wallet, window: 1h, max_usd: "1000000"}
