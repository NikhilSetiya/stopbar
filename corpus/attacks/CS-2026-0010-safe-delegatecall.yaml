id: CS-2026-0010
title: Safe transaction delegatecalls an unknown contract (Bybit pattern, Feb 2025)
category: blind_signing
target: agent_wallet.evm
description: >
  The Bybit cold-wallet theft (about $1.5B) was a Safe transaction whose operation was DELEGATECALL to an
  attacker contract, which rewrote the Safe's implementation slot. The signers saw a routine transfer in a
  compromised UI. The decoder reads the operation field from the transaction itself: a delegatecall to
  anything but the canonical MultiSend runs foreign code as the Safe, and is denied.
setup:
  known_destinations: []
  balances: {ETH: "100"}
  prices_usd: {ETH: "3500"}
request:
  id: req_fixture_0010
  tenant: test
  nonce: c2FmZS1kZWxlZ2F0ZWNhbGwtMTA
  issued_at: "2026-11-05T12:00:00Z"   # template: the replay sets it to now
  ttl_seconds: 60
  actor: {agent_id: treasury-agent}
  action:
    kind: evm_tx
    chain_id: 8453
    from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"   # Anvil test account 0 (public test key, never funded)
    to: "0x6666666666666666666666666666666666666666"     # the Safe (fixture)
    value_wei: "0"
    # execTransaction(0x9f30…0c21, 0, <unknown call>, operation = 1 DELEGATECALL, …)
    data: ""
    tx_type: 2
    tx_nonce: "0"
    gas_limit: "300000"
    max_fee_per_gas: "2000000000"
    max_priority_fee_per_gas: "1000000000"
  provenance: {labels: [trusted_user]}
expected:
  outcome: deny
  policy_ids: [delegatecall]
