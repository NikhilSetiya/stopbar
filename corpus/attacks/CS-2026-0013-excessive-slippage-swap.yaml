id: CS-2026-0013
title: Swap whose minimum output gives away 16% (excessive slippage)
category: agent_error
target: agent_wallet.evm
description: >
  A subtler CS-2026-0009. The agent swaps 5,000 USDC for WETH on a V2-style router with a non-zero
  amountOutMin of 1.2 WETH, so the min_out_zero flag does not fire. At the oracle price ($3,500/ETH) the
  swap should yield about 1.43 WETH: the limit accepts a 16% loss, which an MEV bot can take in a
  sandwich. The destination is the wallet itself and every cap passes. The enricher prices both sides of
  the swap from the same oracle (WETH as ETH) and flags excessive_slippage, since the limit is worse than
  the tenant's 3% max; the starter pack escalates it for a human.
setup:
  known_destinations: []
  balances: {USDC: "100000"}
  prices_usd: {ETH: "3500", USDC: "1"}
  tokens: {"0x3333333333333333333333333333333333333333": {symbol: USDC, decimals: 6}}
request:
  id: req_fixture_0013
  tenant: test
  nonce: ZXhjZXNzaXZlLXNsaXBwYWdlMTM
  issued_at: "2026-11-23T12:00:00Z"   # template: the replay sets it to now
  ttl_seconds: 60
  actor: {agent_id: defi-agent}
  action:
    kind: evm_tx
    chain_id: 8453
    from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"   # Anvil test account 0 (public test key, never funded)
    to: "0x7777777777777777777777777777777777777777"     # V2-style router (fixture)
    value_wei: "0"
    # swapExactTokensForTokens(5,000 USDC, amountOutMin = 1.2 WETH, [USDC, WETH], self, deadline)
    data: ""
    tx_type: 2
    tx_nonce: "0"
    gas_limit: "250000"
    max_fee_per_gas: "2000000000"
    max_priority_fee_per_gas: "1000000000"
  provenance: {labels: [trusted_user]}
expected:
  outcome: escalate
  policy_ids: [excessive-slippage]
