id: CS-2026-0012
title: Salami drain in sub-cap transfers to a new destination
category: velocity_drain
target: agent_wallet.evm
description: >
  An injected or looping agent drains the wallet in slices to one address it has never paid. Each
  transfer is 400 USDC: under every per-request rule (0.4% of balance, far under the $5,000/h wallet
  cap and its 50-transfer count). Taken one at a time, each is allowed. The default salami cap
  (FR-LIM-2a) counts transfers per destination that is not in the registry: the first five in 24h go
  through, and the sixth is flagged soft_cap_exceeded, so the starter pack escalates it for a human
  instead of letting the drain continue.
