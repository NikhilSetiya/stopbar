  id: req_fixture_0016
  tenant: test
  nonce: c2VhcG9ydC16ZXJvLXByaWNlLTAwMTY
  issued_at: "2026-11-25T12:00:00Z"   # template: the replay sets it to now
  ttl_seconds: 60
  actor: {agent_id: nft-agent}
  action:
    kind: evm_typed_data
    chain_id: 8453
    from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"   # Anvil test account 0 (public test key, never funded)
    typed_data:
      types:
        EIP712Domain: [{name: name, type: string}, {name: version, type: string}, {name: chainId, type: uint256}, {name: verifyingContract, type: address}]
        OrderComponents:
